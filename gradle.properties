# ── Gradle ────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
# Disabled: Architectury Loom's prepareArchitecturyTransformer task calls
# Task.project at execution time, which the configuration cache forbids.
org.gradle.configuration-cache=false

# ── Mod identity (shared by every Minecraft version / loader) ─────────────
# Rename these to match your mod - they flow into fabric.mod.json,
# META-INF/mods.toml and META-INF/neoforge.mods.toml at build time (see the
# `processResources` block in fabric/, forge/ and neoforge/'s build.gradle.kts).
modId=alotofinterior
modGroup=com.thefusion21
modVersion=0.1.0-SNAPSHOT
modName=[A Lot Of] Interior
modDescription=Furnish your home with a lot of details
modAuthors=TheFusion21
modLicense=MIT

# Real project IDs/slugs from your Modrinth/CurseForge project pages - TODO,
# these placeholders won't resolve to anything.
modrinthProjectId=TODO_MODRINTH_PROJECT_ID
curseforgeProjectId=1674570
# Nothing actually publishes until you pass -Ppublish.dryRun=false (in
# addition to setting the two project IDs above and the MODRINTH_TOKEN /
# CURSEFORGE_TOKEN environment variables) - see stonecutter.gradle.kts.
publish.dryRun=true